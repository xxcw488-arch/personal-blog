<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    编辑部小插图 sprite sheet · 个人博客
    用法：<svg class="spot" width="24" height="24"><use href="#spot-book"/></svg>
    每个 symbol 均为 48×48，stroke=currentColor / fill=none，可用 CSS color 换色。
    整张表只有 pen-nib 与 coffee-cup 两处实心点缀使用朱砂红。
  -->

  <!-- 1. 摊开的书 -->
  <symbol id="spot-book" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 13.5C20.4 10.6 15 9.4 9.5 9.9V34.6C15 34.1 20.4 35.3 24 38.1C27.6 35.3 33 34.1 38.5 34.6V9.9C33 9.4 27.6 10.6 24 13.5Z"/>
    <path d="M24 13.5V38.1"/>
    <path d="M14 16.6C16.6 16.5 19.3 17.1 21.4 18.3"/>
    <path d="M14 22.6C16.6 22.5 19.3 23.1 21.4 24.3"/>
    <path d="M34 16.6C31.4 16.5 28.7 17.1 26.6 18.3"/>
    <path d="M34 22.6C31.4 22.5 28.7 23.1 26.6 24.3"/>
  </symbol>

  <!-- 2. 钢笔尖（笔尖呼吸孔是朱砂点缀） -->
  <symbol id="spot-pen-nib" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6.5L32 22.4L24 41.5L16 22.4Z"/>
    <circle cx="24" cy="19.5" r="2.7" fill="#a63d2f" stroke="none"/>
    <path d="M24 22.4V37.5"/>
    <path d="M20.6 15.6C22.4 14.7 25.6 14.7 27.4 15.6"/>
  </symbol>

  <!-- 3. 咖啡杯（杯中咖啡是朱砂点缀） -->
  <symbol id="spot-coffee-cup" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 18.5H35.5V27.5C35.5 34 30.4 38.5 24 38.5C17.6 38.5 12.5 34 12.5 27.5Z"/>
    <ellipse cx="24" cy="18.6" rx="11.5" ry="3.1"/>
    <ellipse cx="24" cy="18.8" rx="8.6" ry="1.9" fill="#a63d2f" stroke="none"/>
    <path d="M35.5 21.5H37.2C40.1 21.5 41.8 24.4 40.5 27C39.6 28.8 37.8 30 35.5 30"/>
    <path d="M9.5 41.5H38.5"/>
    <path d="M20.2 13.4C18.9 11 21.5 9.2 20.2 6.6"/>
    <path d="M28 13.4C26.7 11 29.3 9.2 28 6.6"/>
  </symbol>

  <!-- 4. 相机 -->
  <symbol id="spot-camera" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.6 14.5L19.6 9.5H28.4L30.4 14.5"/>
    <path d="M9 14.5H39C40.7 14.5 42 15.8 42 17.5V35C42 36.7 40.7 38 39 38H9C7.3 38 6 36.7 6 35V17.5C6 15.8 7.3 14.5 9 14.5Z"/>
    <circle cx="24" cy="26.5" r="7.6"/>
    <circle cx="24" cy="26.5" r="3.2"/>
    <path d="M36.5 19.5H38.5"/>
  </symbol>

  <!-- 5. 耳机 -->
  <symbol id="spot-headphones" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 30.5V24C9 15.7 15.7 9 24 9C32.3 9 39 15.7 39 24V30.5"/>
    <path d="M6.5 28.5H14V38.5H11C8.5 38.5 6.5 36.5 6.5 34Z"/>
    <path d="M41.5 28.5H34V38.5H37C39.5 38.5 41.5 36.5 41.5 34Z"/>
  </symbol>

  <!-- 6. 盆栽 -->
  <symbol id="spot-potted-plant" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 26.5C19.2 25.6 15.2 21.6 14.2 15.4C20.2 16.1 24 20.4 24 26.5Z"/>
    <path d="M24 26.5C28.8 25.6 32.8 21.6 33.8 15.4C27.8 16.1 24 20.4 24 26.5Z"/>
    <path d="M24 26.5C21.2 22.4 20.4 16.4 24 9.4C27.6 16.4 26.8 22.4 24 26.5Z"/>
    <path d="M13.6 26.5H34.4V30H13.6Z"/>
    <path d="M15.8 30H32.2L29.6 41.5H18.4Z"/>
  </symbol>

  <!-- 7. 纸飞机 -->
  <symbol id="spot-paper-plane" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M41.5 8L6.5 23.5L20.5 27.2L26 40.5Z"/>
    <path d="M41.5 8L20.5 27.2"/>
  </symbol>

  <!-- 8. 钥匙 -->
  <symbol id="spot-key" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="13.5" r="7.5"/>
    <circle cx="24" cy="13.5" r="2.6"/>
    <path d="M24 21V41"/>
    <path d="M24 31.5H30.5"/>
    <path d="M24 36.5H29"/>
  </symbol>

  <!-- 9. 指南针 -->
  <symbol id="spot-compass" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="15.5"/>
    <path d="M24 9.5V12"/>
    <path d="M24 36V38.5"/>
    <path d="M9.5 24H12"/>
    <path d="M36 24H38.5"/>
    <path d="M24 13L28.5 24L24 35L19.5 24Z"/>
  </symbol>

  <!-- 10. 灯泡 -->
  <symbol id="spot-lightbulb" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6.5C17.1 6.5 12 11.6 12 18.3C12 22.6 14.3 26.1 17.5 28.2V32.5H30.5V28.2C33.7 26.1 36 22.6 36 18.3C36 11.6 30.9 6.5 24 6.5Z"/>
    <path d="M18.8 32.5L19.8 40.5H28.2L29.2 32.5"/>
    <path d="M19.2 35.6H28.8"/>
    <path d="M19.5 38.3H28.5"/>
    <path d="M20.5 24L23 20L25 24L27.5 20"/>
  </symbol>

  <!-- 11. 对话气泡 -->
  <symbol id="spot-speech-bubble" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 11H38C40 11 41.5 12.5 41.5 14.5V29.5C41.5 31.5 40 33 38 33H22.5L14 40V33H10C8 33 6.5 31.5 6.5 29.5V14.5C6.5 12.5 8 11 10 11Z"/>
    <circle cx="16.5" cy="22" r="1.9" fill="currentColor" stroke="none"/>
    <circle cx="24" cy="22" r="1.9" fill="currentColor" stroke="none"/>
    <circle cx="31.5" cy="22" r="1.9" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 12. 远山 -->
  <symbol id="spot-mountains" viewBox="0 0 48 48" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 38L15.5 17.5L22.5 28.5L30.5 15L43.5 38Z"/>
    <path d="M12.2 23.6L15.4 21.9L19.2 23.6"/>
    <path d="M26.7 21.2L30.4 19.2L33.8 21.2"/>
  </symbol>
</svg>
